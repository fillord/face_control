<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — МедКонтроль</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6fb; color: #1a2340; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-wrap { width: 100%; max-width: 400px; padding: 24px; }
.logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
.logo-icon { width: 48px; height: 48px; background: #1565C0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.logo-text { font-size: 20px; font-weight: 700; color: #1a2340; }
.logo-sub { font-size: 13px; color: #78909c; }
.card { background: #fff; border: 1px solid #e2e6f0; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(21,101,192,0.07); }
h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: #1a2340; }
.sub { font-size: 13px; color: #78909c; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 500; color: #455a64; margin-bottom: 6px; }
input { width: 100%; padding: 11px 14px; border: 1px solid #cfd8dc; border-radius: 8px; font-size: 14px; color: #1a2340; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
input:focus { border-color: #1565C0; box-shadow: 0 0 0 3px rgba(21,101,192,0.1); }
.btn { width: 100%; padding: 12px; background: #1565C0; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: background 0.15s; margin-top: 8px; }
.btn:hover { background: #0d47a1; }
.error { background: #FFEBEE; color: #B71C1C; border: 1px solid #EF9A9A; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.hint { text-align: center; font-size: 12px; color: #90a4ae; margin-top: 20px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <div class="logo-icon">🏥</div>
    <div>
      <div class="logo-text">МедКонтроль</div>
      <div class="logo-sub">Система учёта рабочего времени</div>
    </div>
  </div>

  <div class="card">
    <h2>Вход в систему</h2>
    <p class="sub">Для доступа к административным функциям</p>

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label>Логин</label>
        <input type="text" name="username" placeholder="admin" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn">Войти</button>
    </form>

    <p class="hint">← <a href="/" style="color:#1565C0;text-decoration:none;">Вернуться к киоску</a></p>
  </div>
</div>
</body>
</html>
