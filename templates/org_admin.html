<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Администратор организации — МедКонтроль</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6fb; color: #1a2340; min-height: 100vh; }
header { background: #fff; border-bottom: 1px solid #e2e6f0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
.logo-icon { width: 34px; height: 34px; background: #1565C0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.user-badge { font-size: 13px; color: #546e7a; }
.btn-logout { padding: 7px 14px; background: #fff; border: 1px solid #e0e0e0; border-radius: 7px; font-size: 13px; color: #546e7a; cursor: pointer; text-decoration: none; transition: all 0.15s; }
.btn-logout:hover { background: #ffebee; color: #c62828; border-color: #ef9a9a; }
.nav-tabs { display: flex; gap: 4px; padding: 0 24px; background: #fff; border-bottom: 1px solid #e2e6f0; }
.tab { padding: 12px 20px; font-size: 13px; font-weight: 600; color: #78909c; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; text-decoration: none; display: inline-block; }
.tab.active { color: #1565C0; border-bottom-color: #1565C0; }
.tab:hover:not(.active) { color: #1a2340; }
.page { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: #fff; border: 1px solid #e2e6f0; border-radius: 12px; padding: 16px; }
.stat-label { font-size: 11px; color: #78909c; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
.stat-val { font-size: 26px; font-weight: 600; }
.stat-val.blue { color: #1565C0; }
.stat-val.green { color: #2E7D32; }
.stat-val.orange { color: #E65100; }
.stat-val.gray { color: #546e7a; }
.table-card { background: #fff; border: 1px solid #e2e6f0; border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; }
thead { background: #f8fafd; }
th { padding: 12px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #546e7a; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid #e2e6f0; white-space: nowrap; }
td { padding: 12px 12px; font-size: 13px; border-bottom: 1px solid #f0f3f8; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px; font-size: 11px; font-weight: 600; }
.btn-primary { padding: 8px 16px; background: #1565C0; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
.btn-primary:hover { background: #0d47a1; }
.btn-secondary { padding: 8px 16px; background: #fff; border: 1px solid #cfd8dc; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; color: #546e7a; }
.btn-edit { padding: 6px 12px; background: #fff; border: 1px solid #cfd8dc; border-radius: 6px; font-size: 12px; color: #546e7a; cursor: pointer; }
.btn-edit:hover { background: #f4f6fb; }
.btn-delete { padding: 6px 12px; background: #fff; border: 1px solid #ef9a9a; border-radius: 6px; font-size: 12px; color: #c62828; cursor: pointer; }
.btn-delete:hover { background: #ffebee; }
.card { background: #fff; border: 1px solid #e2e6f0; border-radius: 14px; padding: 24px; max-width: 480px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { font-size: 13px; font-weight: 600; color: #546e7a; display: block; margin-bottom: 6px; }
.form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #cfd8dc; border-radius: 8px; font-size: 13px; color: #1a2340; outline: none; font-family: inherit; background: #fff; }
.form-group input:focus, .form-group select:focus { border-color: #1565C0; }
.form-actions { display: flex; gap: 10px; margin-top: 8px; }
.hidden { display: none; }
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.error-msg { font-size: 13px; color: #c62828; margin-top: 8px; }
@media (max-width: 700px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-icon">🏥</div> МедКонтроль — Организация</div>
  <div class="header-right">
    <span class="user-badge">{{ username }}</span>
    <a href="/" class="btn-logout" style="border-color:#cfd8dc;color:#546e7a;">← Киоск</a>
    <a href="/logout" class="btn-logout">Выйти</a>
  </div>
</header>

<div class="nav-tabs">
  <span class="tab active" id="tabDepts" onclick="switchTab('depts')">Отделы</span>
  <span class="tab" id="tabEmployees" onclick="switchTab('employees')">Сотрудники</span>
  <a class="tab" href="/admin">Отчёты →</a>
</div>

<div id="panelDepts" class="page">
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Отделов</div>
      <div class="stat-val blue" id="statDepts">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Сотрудников</div>
      <div class="stat-val blue" id="statEmployees">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Сегодня пришли</div>
      <div class="stat-val green" id="statCheckins">—</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-primary" onclick="toggleAddDeptForm()">+ Добавить отдел</button>
  </div>

  <div id="addDeptPanel" class="card hidden">
    <h3 style="font-size:16px;font-weight:600;margin-bottom:16px;" id="deptFormTitle">Новый отдел</h3>
    <input type="hidden" id="editDeptId" value="">
    <div class="form-group">
      <label>Название *</label>
      <input type="text" id="deptName" placeholder="Введите название отдела">
    </div>
    <div class="form-group">
      <label>Руководитель</label>
      <input type="text" id="deptHeadName" placeholder="ФИО руководителя (необязательно)">
    </div>
    <div id="deptFormError" class="error-msg hidden"></div>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveDept()" id="saveDeptBtn">Добавить отдел</button>
      <button class="btn-secondary" onclick="cancelDeptForm()">Отмена</button>
    </div>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Название</th>
          <th>Руководитель</th>
          <th>Сотрудников</th>
          <th>Действия</th>
        </tr>
      </thead>
      <tbody id="deptsTableBody">
        <tr><td colspan="4" style="text-align:center;color:#90a4ae;padding:28px;">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="panelEmployees" class="page hidden">
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>Имя</th>
          <th>Отдел</th>
          <th>График</th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="employeesTableBody">
        <tr><td colspan="4" style="text-align:center;color:#90a4ae;padding:28px;">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// ─── State ────────────────────────────────────────────────────────────────────
let allDepts = [];
let allEmployees = [];

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadDepts(), loadEmployees()]);
  updateStats();
}

// ─── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('tabDepts').classList.toggle('active', tab === 'depts');
  document.getElementById('tabEmployees').classList.toggle('active', tab === 'employees');
  document.getElementById('panelDepts').classList.toggle('hidden', tab !== 'depts');
  document.getElementById('panelEmployees').classList.toggle('hidden', tab !== 'employees');
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('statDepts').textContent = allDepts.length;
  document.getElementById('statEmployees').textContent = allEmployees.length;
  // checkins_today requires /api/superadmin_stats or dept_attendance_today (02-04/02-05)
  document.getElementById('statCheckins').textContent = '—';
}

// ─── Depts CRUD ───────────────────────────────────────────────────────────────
async function loadDepts() {
  try {
    const resp = await fetch('/api/depts');
    allDepts = resp.ok ? await resp.json() : [];
    renderDepts();
  } catch (e) {
    document.getElementById('deptsTableBody').innerHTML =
      '<tr><td colspan="4" style="text-align:center;color:#c62828;padding:28px;">Ошибка при сохранении. Попробуйте ещё раз.</td></tr>';
  }
}

function renderDepts() {
  const tbody = document.getElementById('deptsTableBody');
  if (!allDepts.length) {
    tbody.innerHTML =
      '<tr><td colspan="4" style="text-align:center;color:#90a4ae;padding:28px;">Отделы не найдены. Добавьте первый отдел.</td></tr>';
    updateStats();
    return;
  }
  tbody.innerHTML = allDepts.map(dept => {
    const empCount = allEmployees.filter(e => e.dept_id === dept.id).length;
    const head = dept.head_name ? `<span style="color:#546e7a;">${escapeHtml(dept.head_name)}</span>` : '<span style="color:#bdbdbd;">—</span>';
    return `<tr>
      <td style="font-weight:500;">${escapeHtml(dept.name)}</td>
      <td>${head}</td>
      <td style="color:#1565C0;font-weight:600;">${empCount}</td>
      <td style="display:flex;gap:8px;align-items:center;">
        <button class="btn-edit" onclick="startEditDept('${dept.id}')">Изменить</button>
        <button class="btn-delete" onclick="deleteDept('${dept.id}', '${escapeHtml(dept.name)}')">Удалить</button>
      </td>
    </tr>`;
  }).join('');
  updateStats();
}

function toggleAddDeptForm() {
  const panel = document.getElementById('addDeptPanel');
  const isHidden = panel.classList.contains('hidden');
  if (isHidden) {
    document.getElementById('editDeptId').value = '';
    document.getElementById('deptName').value = '';
    document.getElementById('deptHeadName').value = '';
    document.getElementById('deptFormTitle').textContent = 'Новый отдел';
    document.getElementById('saveDeptBtn').textContent = 'Добавить отдел';
    document.getElementById('deptFormError').classList.add('hidden');
    panel.classList.remove('hidden');
  } else {
    panel.classList.add('hidden');
  }
}

function startEditDept(deptId) {
  const dept = allDepts.find(d => d.id === deptId);
  if (!dept) return;
  document.getElementById('editDeptId').value = deptId;
  document.getElementById('deptName').value = dept.name;
  document.getElementById('deptHeadName').value = dept.head_name || '';
  document.getElementById('deptFormTitle').textContent = 'Изменить отдел';
  document.getElementById('saveDeptBtn').textContent = 'Сохранить изменения';
  document.getElementById('deptFormError').classList.add('hidden');
  document.getElementById('addDeptPanel').classList.remove('hidden');
  document.getElementById('deptName').focus();
}

function cancelDeptForm() {
  document.getElementById('addDeptPanel').classList.add('hidden');
  document.getElementById('deptFormError').classList.add('hidden');
}

async function saveDept() {
  const editId = document.getElementById('editDeptId').value;
  const name = document.getElementById('deptName').value.trim();
  const head_name = document.getElementById('deptHeadName').value.trim();
  const errEl = document.getElementById('deptFormError');

  if (!name) {
    errEl.textContent = 'Заполните все обязательные поля.';
    errEl.classList.remove('hidden');
    return;
  }
  errEl.classList.add('hidden');

  try {
    let resp;
    if (editId) {
      resp = await fetch(`/api/depts/${editId}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, head_name}),
      });
    } else {
      // org_id is supplied server-side from session for org_admin
      resp = await fetch('/api/depts', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, head_name, org_id: null}),
      });
    }
    if (resp.ok) {
      cancelDeptForm();
      await loadDepts();
      updateStats();
    } else {
      const data = await resp.json();
      errEl.textContent = data.error || 'Ошибка при сохранении. Попробуйте ещё раз.';
      errEl.classList.remove('hidden');
    }
  } catch (e) {
    errEl.textContent = 'Ошибка при сохранении. Попробуйте ещё раз.';
    errEl.classList.remove('hidden');
  }
}

async function deleteDept(deptId, deptName) {
  if (!window.confirm(`Удалить отдел «${deptName}»? Все сотрудники отдела потеряют привязку.`)) return;
  try {
    const resp = await fetch(`/api/depts/${deptId}`, {method: 'DELETE'});
    if (resp.ok) {
      await loadDepts();
      updateStats();
    } else if (resp.status === 409) {
      alert('Не удалось удалить. Возможно, запись используется.');
    } else {
      alert('Ошибка при сохранении. Попробуйте ещё раз.');
    }
  } catch (e) {
    alert('Ошибка при сохранении. Попробуйте ещё раз.');
  }
}

// ─── Employees ────────────────────────────────────────────────────────────────
async function loadEmployees() {
  try {
    const resp = await fetch('/api/employees');
    if (!resp.ok) { allEmployees = []; renderEmployees(); return; }
    const data = await resp.json();
    allEmployees = typeof data === 'object' && !Array.isArray(data)
      ? Object.values(data)
      : data;
    renderEmployees();
  } catch (e) {
    allEmployees = [];
    document.getElementById('employeesTableBody').innerHTML =
      '<tr><td colspan="4" style="text-align:center;color:#c62828;padding:28px;">Ошибка при сохранении. Попробуйте ещё раз.</td></tr>';
  }
}

function renderEmployees() {
  const tbody = document.getElementById('employeesTableBody');
  if (!allEmployees.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#90a4ae;padding:28px;">Сотрудники не найдены.</td></tr>';
    return;
  }
  tbody.innerHTML = allEmployees.map(emp => {
    const dept = allDepts.find(d => d.id === emp.dept_id);
    const deptName = dept ? escapeHtml(dept.name) : '<span style="color:#bdbdbd;">—</span>';
    const schedule = emp.schedule
      ? `${emp.schedule.start} – ${emp.schedule.end}`
      : '<span style="color:#bdbdbd;">—</span>';
    const deptOptions = allDepts.map(d =>
      `<option value="${d.id}" ${d.id === emp.dept_id ? 'selected' : ''}>${escapeHtml(d.name)}</option>`
    ).join('');
    return `<tr>
      <td style="font-weight:500;">${escapeHtml(emp.name)}</td>
      <td>
        <select onchange="reassignEmployee('${emp.id}', this.value)" style="padding:4px 8px;border:1px solid #cfd8dc;border-radius:6px;font-size:12px;color:#1a2340;background:#fff;">
          ${deptOptions}
        </select>
      </td>
      <td style="color:#546e7a;font-variant-numeric:tabular-nums;">${schedule}</td>
      <td>
        <span class="badge" style="background:#E8F5E9;color:#1B5E20;">Активен</span>
      </td>
    </tr>`;
  }).join('');
  updateStats();
}

async function reassignEmployee(empId, deptId) {
  try {
    const resp = await fetch(`/api/employees/${empId}`, {
      method: 'PATCH',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({dept_id: deptId}),
    });
    if (!resp.ok) {
      const data = await resp.json();
      alert(data.error || 'Ошибка при сохранении. Попробуйте ещё раз.');
      await loadEmployees();
    }
  } catch (e) {
    alert('Ошибка при сохранении. Попробуйте ещё раз.');
    await loadEmployees();
  }
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
