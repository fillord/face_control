<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ссылка недействительна — МедКонтроль</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f4f6fb; color: #1a2340; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.wrap { width: 100%; max-width: 420px; padding: 24px; }
.logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 32px; }
.logo-icon { width: 48px; height: 48px; background: #1565C0; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.logo-text { font-size: 20px; font-weight: 700; color: #1a2340; }
.logo-sub { font-size: 13px; color: #78909c; }
.card { background: #fff; border: 1px solid #e2e6f0; border-radius: 16px; padding: 40px 32px; box-shadow: 0 4px 24px rgba(21,101,192,0.07); text-align: center; }
.error-icon { font-size: 48px; margin-bottom: 16px; }
h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: #1a2340; }
.message { font-size: 14px; color: #78909c; line-height: 1.6; margin-bottom: 24px; }
.hint { font-size: 12px; color: #b0bec5; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-icon">🏥</div>
    <div>
      <div class="logo-text">МедКонтроль</div>
      <div class="logo-sub">Система учёта рабочего времени</div>
    </div>
  </div>
  <div class="card">
    <div class="error-icon">🔗</div>
    <h2>Ссылка недействительна</h2>
    <div class="message">{{ message }}</div>
    <div class="hint">Обратитесь к администратору организации для получения актуальной ссылки.</div>
  </div>
</div>
</body>
</html>
