{% extends 'base.html' %}
{% block title %}Аудит — МедКонтроль{% endblock %}
{% block head %}
<style>
.toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; background: var(--card-bg); }
.toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
td { padding: 10px 12px; font-size: 12px; border-bottom: 1px solid #f0f3f8; vertical-align: top; word-break: break-word; }
.action-badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.action-badge.create { background: #E8F5E9; color: #2E7D32; }
.action-badge.update { background: #E3F2FD; color: var(--accent); }
.action-badge.delete { background: #FFEBEE; color: #c62828; }
.action-badge.manual { background: #FFF8E1; color: #F57F17; }
.action-badge.register { background: #F3E5F5; color: #6A1B9A; }
.value-cell { max-width: 220px; overflow: hidden; font-size: 11px; color: var(--text-secondary); font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-all; }
.empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
.load-msg { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; }
</style>
{% endblock %}
{% block content %}
<h1 class="page-title">Журнал аудита</h1>

<div class="page">
  <div class="toolbar">
    <input type="text" id="filterAction" placeholder="Фильтр по действию..." style="min-width:180px;">
    <input type="text" id="filterActor" placeholder="Фильтр по пользователю..." style="min-width:180px;">
    <button class="btn-primary" onclick="loadAudit()">Найти</button>
    <button class="btn-secondary" onclick="clearFilters()">Сбросить</button>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th style="min-width:140px;">Время</th>
          <th style="min-width:100px;">Пользователь</th>
          <th style="min-width:120px;">Действие</th>
          <th style="min-width:100px;">Объект</th>
          <th style="min-width:80px;">ID цели</th>
          <th style="min-width:180px;">Было</th>
          <th style="min-width:180px;">Стало</th>
        </tr>
      </thead>
      <tbody id="auditTableBody">
        <tr><td colspan="7" class="load-msg">Загрузка...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const ACTION_LABELS = {
  user_create: 'Создан пользователь',
  user_update: 'Изменён пользователь',
  user_delete: 'Удалён пользователь',
  org_create: 'Создана организация',
  org_update: 'Изменена организация',
  org_delete: 'Удалена организация',
  dept_create: 'Создан отдел',
  dept_update: 'Изменён отдел',
  dept_delete: 'Удалён отдел',
  employee_register: 'Зарегистрирован сотрудник',
  manual_time_edit: 'Правка времени',
};

function actionClass(action) {
  if (action.endsWith('_create') || action.endsWith('_register')) return 'create';
  if (action.endsWith('_update') || action === 'manual_time_edit') return action === 'manual_time_edit' ? 'manual' : 'update';
  if (action.endsWith('_delete')) return 'delete';
  if (action.includes('register')) return 'register';
  return 'update';
}

function formatValue(v) {
  if (!v) return '—';
  try {
    const parsed = JSON.parse(v);
    return JSON.stringify(parsed, null, 2);
  } catch {
    return v;
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadAudit() {
  const action = document.getElementById('filterAction').value.trim();
  const actor = document.getElementById('filterActor').value.trim();
  const tbody = document.getElementById('auditTableBody');
  tbody.innerHTML = '<tr><td colspan="7" class="load-msg">Загрузка...</td></tr>';

  const params = new URLSearchParams();
  if (action) params.set('action', action);
  if (actor) params.set('actor', actor);

  try {
    const resp = await fetch('/api/audit?' + params.toString());
    if (!resp.ok) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Ошибка загрузки данных</td></tr>'; return; }
    const rows = await resp.json();
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Записи не найдены</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const label = ACTION_LABELS[r.action] || r.action;
      const cls = actionClass(r.action);
      const ts = r.ts ? r.ts.replace('T', ' ').slice(0, 19) : '—';
      const targetId = r.target_id ? escapeHtml(r.target_id) : '—';
      return `<tr>
        <td style="font-variant-numeric:tabular-nums;white-space:nowrap;">${escapeHtml(ts)}</td>
        <td>${escapeHtml(r.actor_username || '—')}</td>
        <td><span class="action-badge ${cls}">${escapeHtml(label)}</span></td>
        <td>${escapeHtml(r.target_type || '—')}</td>
        <td style="font-size:11px;color:#90a4ae;">${targetId}</td>
        <td><div class="value-cell">${escapeHtml(formatValue(r.old_value))}</div></td>
        <td><div class="value-cell">${escapeHtml(formatValue(r.new_value))}</div></td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Ошибка соединения</td></tr>';
  }
}

function clearFilters() {
  document.getElementById('filterAction').value = '';
  document.getElementById('filterActor').value = '';
  loadAudit();
}

loadAudit();
</script>
{% endblock %}
