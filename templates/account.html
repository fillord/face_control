{% extends 'base.html' %}
{% block title %}Аккаунт — МедКонтроль{% endblock %}
{% block head %}
<style>
.card { border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(13,148,136,0.07); }
h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); }
.sub { font-size: 13px; color: #78909c; margin-bottom: 24px; }
label { display: block; font-size: 13px; font-weight: 400; color: #455a64; margin-bottom: 6px; }
input[type=text], input[type=password] { width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text-primary); outline: none; transition: border-color 0.15s, box-shadow 0.15s; font-family: inherit; }
input[type=text]:focus, input[type=password]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(13,148,136,0.15); }
.btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; margin-top: 8px; }
.btn:hover { background: var(--accent-hover); }
.error { background: #FFEBEE; color: #B71C1C; border: 1px solid #EF9A9A; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.success { background: #E8F5E9; color: #1B5E20; border: 1px solid #A5D6A7; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
</style>
{% endblock %}
{% block content %}
<h1 class="page-title">Настройки аккаунта</h1>

<div class="page" style="max-width:480px;">
  <div id="msg"></div>

  <div class="card">
    <h2>Смена пароля</h2>
    <p class="sub">Укажите текущий пароль и придумайте новый</p>
    <div class="form-group">
      <label>Текущий пароль</label>
      <input type="password" id="currentPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="form-group">
      <label>Новый пароль</label>
      <input type="password" id="newPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Повторите новый пароль</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn" onclick="savePassword()">Сменить пароль</button>
  </div>
</div>

<script>
function showMsg(text, isError) {
  var el = document.getElementById('msg');
  el.className = isError ? 'error' : 'success';
  el.textContent = isError ? ('⚠ ' + text) : text;
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, 5000);
}

async function savePassword() {
  var currentPassword = document.getElementById('currentPassword').value;
  var newPassword = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  if (newPassword !== confirmPassword) {
    showMsg('Новые пароли не совпадают', true);
    return;
  }
  var res = await fetch('/api/me', {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({current_password: currentPassword, new_password: newPassword})
  });
  var json = await res.json();
  if (!res.ok) {
    showMsg(json.error || 'Ошибка смены пароля', true);
  } else {
    showMsg('Сохранено', false);
    document.getElementById('currentPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
  }
}
</script>
{% endblock %}
